<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Habillage fond vert (CapCut) pour la vidéo « galette individuelle » de l'Épiphanie, 14,233 s.
         Calé sur le clip C0294 : net sur le logo jusqu'à 3,4 s, net sur la galette ensuite,
         main devant la caméra à 9,6 s → transition vagues, puis couronne posée sur la galette.
         Polices : Anton (= Impact) et Zilla Slab (= Eroika Slab), en local. Pas d'ombres (incrustation propre). */
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Zilla"; src: url("assets/fonts/zilla-slab-latin-700-italic.woff2") format("woff2"); font-weight: 700; font-style: italic; }
      @font-face { font-family: "Zilla"; src: url("assets/fonts/zilla-slab-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      :root { --choco: #5C2E15; --choco-dk: #3B1F0E; --creme: #FDF0E2; --caramel: #C58243; --cuivre: #8A4A1C; --or: #F1C680; --vert: #00FF00; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--vert); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--vert); }
      .abs { position: absolute; }
      .anton { font-family: "Anton", sans-serif; font-weight: 400; }
      .zilla { font-family: "Zilla", serif; font-style: italic; font-weight: 700; }
      .center { display: flex; align-items: center; justify-content: center; text-align: center; }
      svg { overflow: visible; }

      /* intro */
      #intro { left: 110px; top: 1650px; width: 860px; height: 130px; }
      #introText { left: 0; top: 0; width: 860px; height: 130px; font-size: 70px; letter-spacing: 3px; color: var(--or); }

      /* panneau 1 */
      #p1 { left: 0; top: 0; width: 1080px; height: 620px; transform-origin: 540px -60px; }
      #cord { left: 532px; top: -120px; width: 16px; height: 260px; border-radius: 8px;
              background: linear-gradient(90deg, #8A4A1C 0%, #F1C680 45%, #D89D58 70%, #8A4A1C 100%); }
      #p1title { left: 110px; top: 214px; width: 860px; font-size: 150px; line-height: 1; letter-spacing: 3px; color: var(--creme); text-align: center; }
      #p1sub { left: 110px; top: 382px; width: 860px; height: 100px; gap: 20px; font-size: 92px; color: var(--or); }
      #p1sub svg { width: 58px; height: 62px; flex: none; }

      /* panneau 2 : pastille frangipane */
      #p2 { left: 40px; top: 578px; width: 370px; height: 370px; }
      #p2txt1 { left: 0; top: 92px; width: 370px; font-size: 58px; color: var(--cuivre); text-align: center; }
      #p2txt2 { left: 0; top: 166px; width: 370px; font-size: 62px; letter-spacing: 2px; color: var(--choco); text-align: center; line-height: 1; }
      #p2txt3 { left: 0; top: 252px; width: 370px; font-size: 38px; color: var(--cuivre); text-align: center; }

      /* panneau 3 : bandeau */
      #p3 { left: 30px; top: 1636px; width: 1020px; height: 150px; transform-origin: 510px 66px; }
      #p3text { left: 70px; top: 12px; width: 880px; height: 108px; font-size: 76px; letter-spacing: 3px; color: var(--creme); }
      #shineClip { left: 70px; top: 12px; width: 880px; height: 108px; overflow: hidden; }
      #shine { left: -200px; top: -20px; width: 120px; height: 150px; transform: skewX(-22deg);
               background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,240,220,0.6) 50%, rgba(255,255,255,0) 100%); }

      /* transition vagues */
      .wave { left: 0; top: 0; width: 1080px; height: 3000px; }

      /* fin */
      #endBand { left: 0; top: 0; width: 1080px; height: 430px; }
      #endTitle { left: 0; top: 52px; width: 1080px; font-size: 136px; line-height: 1; letter-spacing: 3px; color: var(--creme); text-align: center; }
      #endSub { left: 0; top: 218px; width: 1080px; height: 96px; gap: 20px; font-size: 76px; color: var(--or); }
      #endSub svg { width: 54px; height: 58px; flex: none; }
      #crown { left: 320px; top: 660px; width: 540px; height: 343px; transform-origin: 50% 100%; }
      #endLogo { left: 410px; top: 1630px; width: 260px; height: 260px; border-radius: 50%; background: var(--creme); border: 6px solid var(--caramel); }
      #endLogo img { position: absolute; left: 9px; top: 9px; width: 230px; height: 230px; }
      .sp { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14.233" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A3519" /><stop offset="1" stop-color="#4E2510" /></linearGradient>
          <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8721D" /><stop offset="1" stop-color="#E30F20" /></linearGradient>
          <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE3A6" /><stop offset="0.45" stop-color="#F1C680" /><stop offset="1" stop-color="#D89D58" /></linearGradient>
          <linearGradient id="gGoldBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7B46C" /><stop offset="1" stop-color="#B9732F" /></linearGradient>
          <linearGradient id="gAlmond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E2A866" /><stop offset="1" stop-color="#8A4A1C" /></linearGradient>
          <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset="0.5" stop-color="#fff" stop-opacity="0.75" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
          <symbol id="star" viewBox="0 0 40 40"><path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" /></symbol>
          <symbol id="almond" viewBox="0 0 100 140">
            <path d="M50 4 C 80 30, 94 80, 80 112 C 68 138, 32 138, 20 112 C 6 80, 20 30, 50 4 Z" fill="url(#gAlmond)" stroke="#5C2E15" stroke-width="4" />
            <g fill="none" stroke="#6B3519" stroke-width="3" opacity="0.45" stroke-linecap="round">
              <path d="M50 22 C 44 60, 44 96, 50 124" /><path d="M36 40 C 30 70, 32 100, 40 120" /><path d="M64 40 C 70 70, 68 100, 60 120" />
            </g>
            <ellipse cx="38" cy="50" rx="8" ry="20" transform="rotate(18 38 50)" fill="#fff" opacity="0.35" />
          </symbol>
          <symbol id="crownIcon" viewBox="0 0 200 130">
            <path d="M10 124 L10 92 L18 30 L58 74 L100 8 L142 74 L182 30 L190 92 L190 124 Z" fill="url(#gGold)" stroke="#8A4A1C" stroke-width="6" stroke-linejoin="round" />
            <rect x="10" y="92" width="180" height="32" fill="url(#gGoldBand)" stroke="#8A4A1C" stroke-width="6" />
            <circle cx="18" cy="28" r="9" fill="#F1C680" stroke="#8A4A1C" stroke-width="4" />
            <circle cx="100" cy="8" r="10" fill="#F1C680" stroke="#8A4A1C" stroke-width="4" />
            <circle cx="182" cy="28" r="9" fill="#F1C680" stroke="#8A4A1C" stroke-width="4" />
            <circle cx="100" cy="108" r="8" fill="#E30F20" />
          </symbol>
          <symbol id="tiretG" viewBox="0 0 56 60"><g stroke="#F1C680" stroke-width="7" stroke-linecap="round"><line x1="6" y1="10" x2="44" y2="22" /><line x1="4" y1="30" x2="48" y2="30" /><line x1="6" y1="50" x2="44" y2="38" /></g></symbol>
          <symbol id="tiretD" viewBox="0 0 56 60"><g stroke="#F1C680" stroke-width="7" stroke-linecap="round"><line x1="50" y1="10" x2="12" y2="22" /><line x1="52" y1="30" x2="8" y2="30" /><line x1="50" y1="50" x2="12" y2="38" /></g></symbol>
          <clipPath id="crownClip">
            <path d="M20 300 L20 210 L40 92 L95 188 L150 62 L205 170 L260 22 L315 170 L370 62 L425 188 L480 92 L500 210 L500 300 Z" />
          </clipPath>
        </defs>
      </svg>

      <!-- ===== INTRO : C'est l'Épiphanie ===== -->
      <div id="intro" class="abs">
        <svg class="abs" style="left:0;top:0" width="860" height="130" viewBox="0 0 860 130">
          <path d="M0 22 C140 4 290 4 430 18 C570 32 720 32 860 14 L860 112 C720 128 570 128 430 114 C290 100 140 100 0 118 Z" fill="url(#gPanel)" stroke="#3B1F0E" stroke-width="5" />
          <path d="M14 34 C150 18 290 18 430 30 C570 42 710 42 846 26 L846 100 C710 114 570 114 430 102 C290 90 150 90 14 104 Z" fill="none" stroke="#C58243" stroke-width="3" />
        </svg>
        <div id="introText" class="abs anton center">C'EST L'ÉPIPHANIE !</div>
        <svg class="abs" style="left:-70px;top:12px;width:120px;height:78px;transform:rotate(-18deg)"><use href="#crownIcon" /></svg>
        <svg class="abs" style="left:810px;top:12px;width:120px;height:78px;transform:rotate(18deg)"><use href="#crownIcon" /></svg>
      </div>

      <!-- ===== PANNEAU 1 : La galette individuelle ===== -->
      <div id="p1" class="abs">
        <div id="cord" class="abs"></div>
        <svg class="abs" style="left:110px;top:168px" width="860" height="380" viewBox="0 0 860 380">
          <path d="M0 40 C143 12 287 12 430 30 C573 48 717 48 860 20 L860 326 C717 364 573 364 430 342 C287 320 143 320 0 356 Z" fill="url(#gPanel)" stroke="#3B1F0E" stroke-width="6" stroke-linejoin="round" />
          <path d="M20 58 C153 32 290 32 430 50 C570 68 707 68 840 42 L840 310 C707 344 570 344 430 322 C290 302 153 302 20 334 Z" fill="none" stroke="#C58243" stroke-width="4" stroke-linejoin="round" />
        </svg>
        <svg class="abs" style="left:450px;top:108px;width:180px;height:117px"><use href="#crownIcon" /></svg>
        <div id="p1title" class="abs anton">LA GALETTE</div>
        <div id="p1sub" class="abs zilla center">
          <svg><use href="#tiretG" /></svg><span>individuelle</span><svg><use href="#tiretD" /></svg>
        </div>
      </div>

      <!-- ===== PANNEAU 2 : pastille frangipane ===== -->
      <div id="p2" class="abs">
        <svg class="abs" style="left:0;top:0" width="370" height="370" viewBox="0 0 370 370">
          <circle cx="185" cy="185" r="178" fill="#5C2E15" stroke="#3B1F0E" stroke-width="6" />
          <circle cx="185" cy="185" r="160" fill="#FDF0E2" />
          <circle cx="185" cy="185" r="146" fill="none" stroke="#C58243" stroke-width="4" stroke-dasharray="14 10" />
        </svg>
        <div id="p2txt1" class="abs zilla">Intérieur</div>
        <div id="p2txt2" class="abs anton">FRANGIPANE</div>
        <div id="p2txt3" class="abs zilla">aux amandes</div>
        <svg class="abs almond" style="left:-18px;top:-30px;width:78px;height:109px"><use href="#almond" /></svg>
        <svg class="abs almond" style="left:300px;top:-6px;width:64px;height:90px"><use href="#almond" /></svg>
        <svg class="abs almond" style="left:318px;top:268px;width:74px;height:104px"><use href="#almond" /></svg>
      </div>

      <!-- ===== PANNEAU 3 : Disponible en boutique ===== -->
      <div id="p3" class="abs">
        <svg class="abs" style="left:0;top:0" width="1020" height="150" viewBox="0 0 1020 150">
          <path d="M0 34 L130 34 L130 142 L0 142 L40 88 Z" fill="#9E0D18" />
          <path d="M1020 34 L890 34 L890 142 L1020 142 L980 88 Z" fill="#9E0D18" />
          <path d="M70 120 L130 142 L130 120 Z" fill="#5E0710" />
          <path d="M950 120 L890 142 L890 120 Z" fill="#5E0710" />
          <rect x="70" y="12" width="880" height="108" fill="url(#gBand)" />
          <g stroke="#FDF0E2" stroke-width="3" stroke-dasharray="12 9" opacity="0.6"><line x1="86" y1="24" x2="934" y2="24" /><line x1="86" y1="108" x2="934" y2="108" /></g>
        </svg>
        <div id="shineClip" class="abs"><div id="shine" class="abs"></div></div>
        <div id="p3text" class="abs anton center">DISPONIBLE EN BOUTIQUE</div>
      </div>

      <svg id="crown" class="abs" viewBox="0 0 520 330">
        <path d="M20 300 L20 210 L40 92 L95 188 L150 62 L205 170 L260 22 L315 170 L370 62 L425 188 L480 92 L500 210 L500 300 Z"
              fill="url(#gGold)" stroke="#8A4A1C" stroke-width="7" stroke-linejoin="round" />
        <g fill="none" stroke="#FFF6DD" stroke-width="5" stroke-linecap="round" opacity="0.7">
          <path d="M48 196 L58 122" /><path d="M160 150 L170 100" /><path d="M268 140 L272 70" />
        </g>
        <circle cx="260" cy="128" r="20" fill="#E30F20" stroke="#8A4A1C" stroke-width="5" />
        <circle cx="254" cy="121" r="6" fill="#fff" opacity="0.7" />
        <circle cx="150" cy="150" r="13" fill="#E8721D" stroke="#8A4A1C" stroke-width="4" />
        <circle cx="370" cy="150" r="13" fill="#E8721D" stroke="#8A4A1C" stroke-width="4" />
        <rect x="20" y="210" width="480" height="90" fill="url(#gGoldBand)" stroke="#8A4A1C" stroke-width="7" />
        <g fill="#E30F20" stroke="#8A4A1C" stroke-width="4">
          <path d="M66 236 L84 255 L66 274 L48 255 Z" /><path d="M454 236 L472 255 L454 274 L436 255 Z" />
        </g>
        <text x="260" y="282" text-anchor="middle" font-family="Anton" font-size="66" letter-spacing="6" fill="#5C2E15">GALZIN</text>
        <g fill="#F1C680" stroke="#8A4A1C" stroke-width="5">
          <circle cx="40" cy="88" r="15" /><circle cx="150" cy="58" r="15" /><circle cx="260" cy="18" r="17" /><circle cx="370" cy="58" r="15" /><circle cx="480" cy="88" r="15" />
        </g>
        <g clip-path="url(#crownClip)"><rect id="crownShine" x="-200" y="0" width="120" height="330" fill="url(#gShine)" transform="skewX(-18)" /></g>
      </svg>

      <!-- ===== FIN : Tirez les rois ===== -->
      <div id="endBand" class="abs">
        <svg class="abs" style="left:0;top:0" width="1080" height="430" viewBox="0 0 1080 430">
          <path d="M0 -10 L1080 -10 L1080 360 C900 410 720 410 540 380 C360 350 180 350 0 392 Z" fill="url(#gPanel)" stroke="#3B1F0E" stroke-width="6" />
          <path d="M0 362 C180 322 360 322 540 352 C720 382 900 382 1080 336" fill="none" stroke="#C58243" stroke-width="5" />
        </svg>
        <div id="endTitle" class="abs anton">TIREZ LES ROIS !</div>
        <div id="endSub" class="abs zilla center"><svg><use href="#tiretG" /></svg><span>Bonne Épiphanie</span><svg><use href="#tiretD" /></svg></div>
      </div>


      <div id="endLogo" class="abs"><img src="assets/img/galzin-logo.png" alt="Logo Galzin" /></div>

      <!-- ===== TRANSITION : vagues caramel + chocolat (au passage de la main) ===== -->
      <svg id="w1" class="abs wave" viewBox="0 0 1080 3000">
        <path d="M0 110 C180 30 360 30 540 90 C720 150 900 150 1080 70 L1080 2900 C900 2980 720 2980 540 2920 C360 2860 180 2860 0 2940 Z" fill="#C58243" />
      </svg>
      <svg id="w2" class="abs wave" viewBox="0 0 1080 3000">
        <path d="M0 120 C180 40 360 40 540 100 C720 160 900 160 1080 80 L1080 2880 C900 2960 720 2960 540 2900 C360 2840 180 2840 0 2920 Z" fill="#5C2E15" />
        <path d="M0 2860 C180 2780 360 2780 540 2840 C720 2900 900 2900 1080 2820" fill="none" stroke="#F1C680" stroke-width="8" />
        <path d="M0 180 C180 100 360 100 540 160 C720 220 900 220 1080 140" fill="none" stroke="#F1C680" stroke-width="8" />
        <g id="wipeCrown"><use href="#crownIcon" x="320" y="1360" width="440" height="286" /></g>
      </svg>
    </div>
    <script>
      const root = document.getElementById("root");
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      const T_HAND = 9.6;          // passage de la main devant la caméra
      const END = 14.233;

      function star(x, y, color, size) {
        const s = document.createElementNS(NS, "svg");
        s.setAttribute("class", "sp");
        s.setAttribute("viewBox", "0 0 40 40");
        s.innerHTML = '<use href="#star" fill="' + color + '"/>';
        s.style.left = x + "px"; s.style.top = y + "px";
        if (size) { s.style.width = size + "px"; s.style.height = size + "px"; s.style.margin = (-size / 2) + "px 0 0 " + (-size / 2) + "px"; }
        root.insertBefore(s, document.getElementById("w1"));
        return s;
      }

      // ---------- états initiaux ----------
      gsap.set("#intro", { y: 320 });
      gsap.set("#p1", { y: -760, rotation: 0 });
      gsap.set("#p2", { scale: 0, rotation: -200 });
      gsap.set(".almond", { scale: 0 });
      gsap.set("#p3", { scaleX: 0.04, autoAlpha: 0 });
      gsap.set("#p3text", { autoAlpha: 0, y: 16 });
      gsap.set(["#endBand", "#endLogo", "#crown"], { autoAlpha: 0 });
      gsap.set("#w1", { y: 1960 });
      gsap.set("#w2", { y: 1960 });
      gsap.set("#wipeCrown", { scale: 0, svgOrigin: "540 1503" });

      // ---------- 0 → 3,4 s : intro (logo net) ----------
      // étoiles dorées qui tombent doucement autour du logo
      const fall = [[90, 0.2, 1], [980, 0.45, 0], [300, 0.7, 1], [760, 0.95, 0], [520, 1.2, 1], [180, 1.45, 0], [880, 1.7, 1], [420, 1.95, 0], [640, 2.2, 1], [60, 2.45, 0]];
      fall.forEach(([x, at, c], i) => {
        const s = star(x, -40, c ? "#F1C680" : "#FDF0E2", 34 + (i % 3) * 12);
        gsap.set(s, { autoAlpha: 0 });
        tl.fromTo(s, { autoAlpha: 1, y: 0, rotation: 0 }, { y: 760 + (i % 4) * 120, rotation: 260 * (i % 2 ? 1 : -1), duration: 1.6, ease: "none", immediateRender: false }, at);
        tl.to(s, { autoAlpha: 0, scale: 0.3, duration: 0.4, ease: "power1.in" }, at + 1.2);
      });
      tl.to("#intro", { y: 0, duration: 0.6, ease: "back.out(1.5)" }, 0.45);
      tl.to("#intro", { scale: 1.04, duration: 0.18, ease: "power2.out" }, 1.1);
      tl.to("#intro", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.28);
      tl.to("#intro", { y: 320, duration: 0.45, ease: "back.in(1.4)" }, 2.95);

      // ---------- 3,5 s : panneau 1 tombe (au moment où la galette devient nette) ----------
      tl.to("#p1", { y: 30, duration: 0.6, ease: "power2.in" }, 3.45);
      tl.to("#p1", { y: -12, duration: 0.2, ease: "power2.out" }, 4.05);
      tl.to("#p1", { y: 5, duration: 0.18, ease: "sine.inOut" }, 4.25);
      tl.to("#p1", { y: 0, duration: 0.22, ease: "sine.out" }, 4.43);
      let t = 4.05;
      [4.5, -3.2, 2.1, -1.2, 0.6, 0].forEach((a, i) => { const d = 0.34 + i * 0.03; tl.to("#p1", { rotation: a, duration: d, ease: "sine.inOut" }, t); t += d; });
      tl.to("#p1", { rotation: 0.7, duration: 0.8, ease: "sine.inOut" }, 6.4);
      tl.to("#p1", { rotation: -0.7, duration: 1.2, ease: "sine.inOut" }, 7.2);
      tl.to("#p1", { rotation: 0.3, duration: 1.0, ease: "sine.inOut" }, 8.4);

      // ---------- 5,0 s : panneau 2, pastille frangipane ----------
      tl.to("#p2", { scale: 1, rotation: -6, duration: 0.7, ease: "back.out(1.7)" }, 5.0);
      tl.to(".almond", { scale: 1, duration: 0.45, ease: "back.out(2.5)", stagger: 0.12 }, 5.45);
      tl.to("#p2", { rotation: -2, duration: 1.1, ease: "sine.inOut" }, 5.75);
      tl.to("#p2", { rotation: -7, duration: 1.3, ease: "sine.inOut" }, 6.85);
      tl.to("#p2", { rotation: -4, duration: 1.3, ease: "sine.inOut" }, 8.15);
      tl.to(".almond", { y: -10, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.2 }, 6.1);
      [[60, 600, 5.3], [400, 620, 5.45], [380, 930, 5.6]].forEach(([x, y, at], i) => {
        const s = star(x, y, i % 2 ? "#FDF0E2" : "#F1C680", 40);
        gsap.set(s, { autoAlpha: 0, scale: 0 });
        tl.to(s, { autoAlpha: 1, scale: 1.1, rotation: 90, duration: 0.25, ease: "back.out(2)" }, at);
        tl.to(s, { autoAlpha: 0, scale: 0, rotation: 180, duration: 0.3, ease: "power2.in" }, at + 0.35);
      });

      // ---------- 6,5 s : panneau 3, Disponible en boutique ----------
      tl.to("#p3", { autoAlpha: 1, duration: 0.05 }, 6.5);
      tl.to("#p3", { scaleX: 1, duration: 0.55, ease: "back.out(1.5)" }, 6.5);
      tl.to("#p3text", { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, 6.82);
      tl.to("#p3", { scale: 1.05, duration: 0.18, ease: "power2.out" }, 7.25);
      tl.to("#p3", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 7.43);
      tl.fromTo("#shine", { x: 0 }, { x: 1200, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 7.25);
      tl.fromTo("#shine", { x: 0 }, { x: 1200, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 8.55);

      // ---------- 9,6 s : transition vagues au passage de la main ----------
      // w2 (chocolat) couvre tout l'écran entre ~9,5 et ~9,75 s ; w1 (caramel) déborde devant et derrière.
      tl.to("#w1", { y: -170, duration: 0.3, ease: "power3.out" }, T_HAND - 0.43);
      tl.to("#w1", { y: -900, duration: 0.26, ease: "none" }, T_HAND - 0.13);
      tl.to("#w1", { y: -3100, duration: 0.38, ease: "power3.in" }, T_HAND + 0.18);
      tl.to("#w2", { y: -170, duration: 0.3, ease: "power3.out" }, T_HAND - 0.37);
      tl.to("#w2", { y: -900, duration: 0.26, ease: "none" }, T_HAND - 0.07);
      tl.to("#w2", { y: -3100, duration: 0.36, ease: "power3.in" }, T_HAND + 0.19);
      tl.to("#wipeCrown", { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, T_HAND - 0.2);
      // échange des éléments sous le rideau
      tl.set(["#p1", "#p2", "#p3"], { autoAlpha: 0 }, T_HAND);
      tl.set("#endBand", { autoAlpha: 1 }, T_HAND);

      // ---------- fin : la couronne se pose sur la galette ----------
      const CR = -10; // inclinaison de la galette
      gsap.set("#crown", { y: -1150, rotation: CR - 35 });
      tl.set("#crown", { autoAlpha: 1 }, T_HAND + 0.4);
      tl.to("#crown", { y: 0, rotation: CR, duration: 0.55, ease: "power2.in" }, T_HAND + 0.45);
      tl.to("#crown", { scaleY: 0.86, scaleX: 1.08, duration: 0.09, ease: "power2.out" }, T_HAND + 1.0);
      tl.to("#crown", { scaleY: 1.04, scaleX: 0.97, y: -26, duration: 0.17, ease: "power2.out" }, T_HAND + 1.09);
      tl.to("#crown", { scaleY: 1, scaleX: 1, y: 0, duration: 0.22, ease: "power2.in" }, T_HAND + 1.26);
      // gerbe d'étoiles à l'atterrissage
      for (let k = 0; k < 10; k++) {
        const a = -Math.PI + (k / 9) * Math.PI;
        const s = star(590, 930, k % 3 === 0 ? "#FDF0E2" : (k % 3 === 1 ? "#F1C680" : "#E8721D"), 46 - (k % 3) * 8);
        gsap.set(s, { autoAlpha: 0 });
        tl.fromTo(s, { autoAlpha: 1, x: 0, y: 0, scale: 0.3, rotation: 0 },
          { x: Math.cos(a) * (300 + (k % 2) * 90), y: Math.sin(a) * (230 + (k % 2) * 70), scale: 1, rotation: 160, duration: 0.6, ease: "power3.out", immediateRender: false }, T_HAND + 1.0);
        tl.to(s, { autoAlpha: 0, scale: 0.2, duration: 0.3, ease: "power1.in" }, T_HAND + 1.45);
      }
      tl.to("#endLogo", { autoAlpha: 1, duration: 0.05 }, T_HAND + 1.25);
      tl.fromTo("#endLogo", { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)", immediateRender: false }, T_HAND + 1.25);
      tl.fromTo("#endTitle", { scale: 1 }, { scale: 1.06, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, T_HAND + 1.05);
      // reflets sur la couronne + petits scintillements jusqu'à la fin
      tl.fromTo("#crownShine", { x: -200 }, { x: 760, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 11.9);
      tl.fromTo("#crownShine", { x: -200 }, { x: 760, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 13.2);
      tl.to("#crown", { rotation: CR + 1.5, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.5);
      [[340, 720, 11.6], [860, 760, 12.1], [600, 640, 12.6], [300, 1500, 13.0], [800, 1560, 13.4], [470, 690, 13.75]].forEach(([x, y, at], i) => {
        const s = star(x, y, i % 2 ? "#FDF0E2" : "#F1C680", 42);
        gsap.set(s, { autoAlpha: 0, scale: 0 });
        tl.to(s, { autoAlpha: 1, scale: 1.1, rotation: 90, duration: 0.25, ease: "back.out(2)" }, at);
        tl.to(s, { autoAlpha: 0, scale: 0, rotation: 180, duration: 0.3, ease: "power2.in" }, at + 0.32);
      });
      tl.set({}, {}, END);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
