<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Overlay transparent (CapCut) : une étiquette Galzin suspendue à un ruban rouge tombe du haut,
         se balance et se pose au-dessus des cakes ; oranges confites, cerises et carrés de chocolat tombent autour.
         Polices : Anton (= Impact) et Zilla Slab (= Eroika Slab) en local. */
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Zilla"; src: url("assets/fonts/zilla-slab-latin-700-italic.woff2") format("woff2"); font-weight: 700; font-style: italic; }
      @font-face { font-family: "Zilla"; src: url("assets/fonts/zilla-slab-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      :root {
        --choco: #5C2E15; --choco-dk: #3B1F0E; --creme: #FDF0E2; --caramel: #C58243;
        --or: #F1C680; --orange: #E8721D; --rouge: #E30F20;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }

      #sign { position: absolute; left: 0; top: 0; width: 1080px; height: 900px; transform-origin: 540px -60px; }
      .shadow #panel, .shadow #banner, .shadow .fruit svg, .shadow #medal { filter: drop-shadow(0 14px 18px rgba(30, 12, 4, 0.45)); }

      #ribbon { position: absolute; left: 527px; top: -80px; width: 26px; height: 200px;
                background: linear-gradient(90deg, #9E0D18 0%, #E30F20 30%, #FF4B4B 50%, #E30F20 70%, #9E0D18 100%); }
      #panel { position: absolute; left: 90px; top: 190px; width: 900px; height: 470px; }

      #medal { position: absolute; left: 430px; top: 92px; width: 220px; height: 220px; border-radius: 50%;
               background: var(--creme); border: 5px solid var(--caramel); }
      #medal img { position: absolute; left: 7px; top: 7px; width: 196px; height: 196px; }
      #bow { position: absolute; left: 470px; top: 54px; width: 140px; height: 80px; }

      #title { position: absolute; left: 90px; top: 312px; width: 900px; text-align: center;
               font-family: "Anton", sans-serif; font-size: 156px; line-height: 1; letter-spacing: 3px;
               color: var(--creme); }
      #sub { position: absolute; left: 90px; top: 478px; width: 900px; height: 84px;
             display: flex; align-items: center; justify-content: center; gap: 18px;
             font-family: "Zilla", serif; font-style: italic; font-weight: 700; font-size: 70px; color: var(--or); }
      #sub svg { width: 56px; height: 60px; flex: none; }

      #banner { position: absolute; left: 100px; top: 578px; width: 880px; height: 130px; transform-origin: 440px 57px; }
      #banner svg { position: absolute; left: 0; top: 0; width: 880px; height: 130px; }
      #bannerText { position: absolute; left: 60px; top: 10px; width: 760px; height: 94px;
                    display: flex; align-items: center; justify-content: center;
                    font-family: "Anton", sans-serif; font-size: 64px; letter-spacing: 3px; color: var(--creme); }
      #shineClip { position: absolute; left: 60px; top: 10px; width: 760px; height: 94px; overflow: hidden; }
      #shine { position: absolute; left: -200px; top: -20px; width: 110px; height: 140px; transform: skewX(-22deg);
               background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,240,220,0.55) 50%, rgba(255,255,255,0) 100%); }

      .fruit { position: absolute; }
      .fruit .bob { width: 100%; height: 100%; }
      .fruit svg { width: 100%; height: 100%; display: block; overflow: visible; }
      .sp { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; }
    </style>
  </head>
  <body>
    <div id="root" class="shadow" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position:absolute">
        <defs>
          <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6A3519" /><stop offset="1" stop-color="#4E2510" />
          </linearGradient>
          <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#E8721D" /><stop offset="1" stop-color="#E30F20" />
          </linearGradient>
          <radialGradient id="gFlesh" cx="0.45" cy="0.4" r="0.6">
            <stop offset="0" stop-color="#FFC56B" /><stop offset="1" stop-color="#F2861A" />
          </radialGradient>
          <radialGradient id="gCherry" cx="0.35" cy="0.3" r="0.75">
            <stop offset="0" stop-color="#FF5A5A" /><stop offset="0.55" stop-color="#E30F20" /><stop offset="1" stop-color="#8E0614" />
          </radialGradient>
          <linearGradient id="gChoc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6B3519" /><stop offset="1" stop-color="#3B1F0E" />
          </linearGradient>
          <linearGradient id="gRibbon" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FF4B4B" /><stop offset="1" stop-color="#B00A18" />
          </linearGradient>
          <!-- Tranche d'orange confite -->
          <symbol id="orange" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="96" fill="#E8721D" stroke="#B9500F" stroke-width="5" />
            <circle cx="100" cy="100" r="84" fill="#FFF1D2" />
            <circle cx="100" cy="100" r="76" fill="url(#gFlesh)" />
            <g stroke="#FFE9C2" stroke-width="5" stroke-linecap="round">
              <line x1="100" y1="100" x2="100" y2="26" /><line x1="100" y1="100" x2="143" y2="38" />
              <line x1="100" y1="100" x2="170" y2="77" /><line x1="100" y1="100" x2="170" y2="123" />
              <line x1="100" y1="100" x2="143" y2="162" /><line x1="100" y1="100" x2="100" y2="174" />
              <line x1="100" y1="100" x2="57" y2="162" /><line x1="100" y1="100" x2="30" y2="123" />
              <line x1="100" y1="100" x2="30" y2="77" /><line x1="100" y1="100" x2="57" y2="38" />
            </g>
            <circle cx="100" cy="100" r="9" fill="#FFE9C2" />
            <ellipse cx="70" cy="58" rx="34" ry="14" transform="rotate(-35 70 58)" fill="#fff" opacity="0.45" />
            <g fill="#fff" opacity="0.9"><circle cx="128" cy="62" r="3" /><circle cx="58" cy="128" r="2.5" /><circle cx="140" cy="140" r="3" /><circle cx="84" cy="150" r="2" /></g>
          </symbol>
          <!-- Cerises confites -->
          <symbol id="cerises" viewBox="0 0 200 200">
            <path d="M68 128 C 78 80, 100 50, 128 22" fill="none" stroke="#6B4A1E" stroke-width="7" stroke-linecap="round" />
            <path d="M138 118 C 136 80, 134 50, 128 22" fill="none" stroke="#6B4A1E" stroke-width="7" stroke-linecap="round" />
            <path d="M128 24 C 150 4, 184 12, 190 30 C 166 40, 142 38, 128 24 Z" fill="#55602A" />
            <circle cx="66" cy="146" r="46" fill="url(#gCherry)" />
            <circle cx="140" cy="138" r="46" fill="url(#gCherry)" />
            <ellipse cx="50" cy="128" rx="14" ry="9" transform="rotate(-30 50 128)" fill="#fff" opacity="0.75" />
            <ellipse cx="124" cy="120" rx="14" ry="9" transform="rotate(-30 124 120)" fill="#fff" opacity="0.75" />
          </symbol>
          <symbol id="cerise" viewBox="0 0 200 200">
            <path d="M100 120 C 104 80, 120 50, 146 26" fill="none" stroke="#6B4A1E" stroke-width="8" stroke-linecap="round" />
            <circle cx="96" cy="136" r="56" fill="url(#gCherry)" />
            <ellipse cx="76" cy="114" rx="17" ry="11" transform="rotate(-30 76 114)" fill="#fff" opacity="0.75" />
          </symbol>
          <!-- Carré de chocolat (2 x 2) -->
          <symbol id="choco" viewBox="0 0 200 200">
            <rect x="8" y="8" width="184" height="184" rx="18" fill="#3B1F0E" />
            <g>
              <rect x="16" y="16" width="80" height="80" rx="8" fill="url(#gChoc)" />
              <rect x="104" y="16" width="80" height="80" rx="8" fill="url(#gChoc)" />
              <rect x="16" y="104" width="80" height="80" rx="8" fill="url(#gChoc)" />
              <rect x="104" y="104" width="80" height="80" rx="8" fill="url(#gChoc)" />
            </g>
            <g fill="#8A4A1C" opacity="0.9">
              <path d="M16 24 Q16 16 24 16 L88 16 L78 28 L28 28 L28 78 L16 88 Z" />
              <path d="M104 24 Q104 16 112 16 L176 16 L166 28 L116 28 L116 78 L104 88 Z" />
              <path d="M16 112 Q16 104 24 104 L88 104 L78 116 L28 116 L28 166 L16 176 Z" />
              <path d="M104 112 Q104 104 112 104 L176 104 L166 116 L116 116 L116 166 L104 176 Z" />
            </g>
            <ellipse cx="60" cy="40" rx="26" ry="7" transform="rotate(-20 60 40)" fill="#fff" opacity="0.18" />
          </symbol>
          <symbol id="star" viewBox="0 0 40 40">
            <path d="M20 0 L24 16 L40 20 L24 24 L20 40 L16 24 L0 20 L16 16 Z" />
          </symbol>
        </defs>
      </svg>

      <div id="sign">
        <div id="ribbon"></div>

        <svg id="panel" viewBox="0 0 900 470">
          <path d="M0 42 C150 12 300 12 450 32 C600 52 750 52 900 22 L900 410 C750 452 600 452 450 426 C300 400 150 400 0 442 Z"
                fill="url(#gPanel)" stroke="#3B1F0E" stroke-width="6" stroke-linejoin="round" />
          <path d="M22 60 C160 32 300 32 450 52 C600 72 740 72 878 44 L878 392 C740 430 600 430 450 406 C300 382 160 382 22 420 Z"
                fill="none" stroke="#C58243" stroke-width="4" stroke-linejoin="round" />
        </svg>

        <div id="title">NOS CAKES</div>
        <div id="sub">
          <svg viewBox="0 0 56 60"><g stroke="#F1C680" stroke-width="7" stroke-linecap="round"><line x1="6" y1="10" x2="44" y2="22" /><line x1="4" y1="30" x2="48" y2="30" /><line x1="6" y1="50" x2="44" y2="38" /></g></svg>
          <span id="subText">Fruits &amp; Chocolat</span>
          <svg viewBox="0 0 56 60"><g stroke="#F1C680" stroke-width="7" stroke-linecap="round"><line x1="50" y1="10" x2="12" y2="22" /><line x1="52" y1="30" x2="8" y2="30" /><line x1="50" y1="50" x2="12" y2="38" /></g></svg>
        </div>

        <div id="banner">
          <svg viewBox="0 0 880 130">
            <path d="M0 30 L112 30 L112 122 L0 122 L34 76 Z" fill="#9E0D18" />
            <path d="M880 30 L768 30 L768 122 L880 122 L846 76 Z" fill="#9E0D18" />
            <path d="M60 104 L112 122 L112 104 Z" fill="#5E0710" />
            <path d="M820 104 L768 122 L768 104 Z" fill="#5E0710" />
            <rect x="60" y="10" width="760" height="94" fill="url(#gBand)" />
            <g stroke="#FDF0E2" stroke-width="3" stroke-dasharray="12 9" opacity="0.55">
              <line x1="76" y1="21" x2="804" y2="21" /><line x1="76" y1="93" x2="804" y2="93" />
            </g>
          </svg>
          <div id="shineClip"><div id="shine"></div></div>
          <div id="bannerText">DISPONIBLE EN MAGASIN</div>
        </div>

        <svg id="bow" viewBox="0 0 140 80">
          <path d="M70 40 C 40 0, 4 6, 8 30 C 10 52, 44 52, 70 40 Z" fill="url(#gRibbon)" stroke="#8E0614" stroke-width="3" />
          <path d="M70 40 C 100 0, 136 6, 132 30 C 130 52, 96 52, 70 40 Z" fill="url(#gRibbon)" stroke="#8E0614" stroke-width="3" />
          <path d="M64 44 L44 78 L58 74 L66 80 Z" fill="#B00A18" />
          <path d="M76 44 L96 78 L82 74 L74 80 Z" fill="#B00A18" />
          <circle cx="70" cy="40" r="12" fill="#E30F20" stroke="#8E0614" stroke-width="3" />
        </svg>
        <div id="medal"><img src="assets/img/galzin-logo.png" alt="Logo Galzin" /></div>

        <!-- fruits & chocolats : position de repos (left/top/size), rotation de repos -->
        <div class="fruit" id="f1" style="left:22px;top:140px;width:170px;height:170px"><div class="bob"><svg><use href="#orange" /></svg></div></div>
        <div class="fruit" id="f2" style="left:858px;top:118px;width:170px;height:170px"><div class="bob"><svg><use href="#cerises" /></svg></div></div>
        <div class="fruit" id="f3" style="left:14px;top:520px;width:128px;height:128px"><div class="bob"><svg><use href="#choco" /></svg></div></div>
        <div class="fruit" id="f4" style="left:944px;top:540px;width:112px;height:112px"><div class="bob"><svg><use href="#choco" /></svg></div></div>
        <div class="fruit" id="f5" style="left:956px;top:330px;width:112px;height:112px"><div class="bob"><svg><use href="#orange" /></svg></div></div>
        <div class="fruit" id="f6" style="left:0px;top:356px;width:104px;height:104px"><div class="bob"><svg><use href="#cerise" /></svg></div></div>
      </div>
    </div>
    <script>
      const root = document.getElementById("root");
      const sign = document.getElementById("sign");
      const tl = gsap.timeline({ paused: true });

      // ---------- état initial ----------
      gsap.set(sign, { y: -780, rotation: 0 });
      gsap.set("#medal", { scale: 0.4, rotation: -60 });
      gsap.set("#banner", { scaleX: 0.05, autoAlpha: 0 });
      gsap.set("#bannerText", { autoAlpha: 0, y: 14 });
      gsap.set("#sub", { autoAlpha: 0, scale: 0.7 });

      // ---------- 1. CHUTE (0 → 0.7) + rebond du ruban ----------
      tl.to(sign, { y: 34, duration: 0.7, ease: "power2.in" }, 0);
      tl.to(sign, { y: -14, duration: 0.22, ease: "power2.out" }, 0.7);
      tl.to(sign, { y: 6, duration: 0.2, ease: "sine.inOut" }, 0.92);
      tl.to(sign, { y: 0, duration: 0.25, ease: "sine.out" }, 1.12);

      // balancier amorti puis légère respiration
      const swing = [5, -3.6, 2.4, -1.5, 0.8, 0];
      let t = 0.7;
      swing.forEach((a, i) => {
        const d = 0.34 + i * 0.03;
        tl.to(sign, { rotation: a, duration: d, ease: "sine.inOut" }, t);
        t += d;
      });
      // t ≈ 2.98
      tl.to(sign, { rotation: 0.6, duration: 0.6, ease: "sine.inOut" }, 3.0);
      tl.to(sign, { rotation: -0.6, duration: 1.0, ease: "sine.inOut" }, 3.6);
      tl.to(sign, { rotation: 0, duration: 0.6, ease: "sine.inOut" }, 4.6);

      // ---------- 2. LOGO + accroche + bandeau ----------
      tl.to("#medal", { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.4)" }, 0.68);
      tl.to("#sub", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.95);
      tl.to("#banner", { autoAlpha: 1, duration: 0.05 }, 1.05);
      tl.to("#banner", { scaleX: 1, duration: 0.5, ease: "back.out(1.6)" }, 1.05);
      tl.to("#bannerText", { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.35);
      tl.fromTo("#shine", { x: 0 }, { x: 1080, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 1.75);
      tl.fromTo("#shine", { x: 0 }, { x: 1080, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 3.75);
      tl.to("#banner", { scale: 1.05, duration: 0.18, ease: "power2.out" }, 1.75);
      tl.to("#banner", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.93);

      // ---------- 3. FRUITS & CHOCOLATS qui tombent ----------
      // [id, départ, rotation de repos, sens de rotation pendant la chute]
      const fruits = [
        ["#f1", 0.55, -18, -1], ["#f2", 0.68, 14, 1], ["#f6", 0.82, -10, -1],
        ["#f5", 0.92, 24, 1], ["#f3", 1.04, 16, 1], ["#f4", 1.14, -14, -1],
      ];
      const sparkColors = ["#F1C680", "#FDF0E2", "#F1C680", "#E8721D"];
      fruits.forEach(([id, start, rot, dir], i) => {
        const el = document.querySelector(id);
        gsap.set(el, { y: -1250, rotation: rot - 220 * dir, autoAlpha: 1 });
        tl.to(el, { y: 0, rotation: rot, duration: 0.62, ease: "power2.in" }, start);
        tl.to(el, { y: -26, rotation: rot + 6 * dir, duration: 0.16, ease: "power2.out" }, start + 0.62);
        tl.to(el, { y: 0, rotation: rot, duration: 0.2, ease: "power2.in" }, start + 0.78);
        // flottement léger ensuite
        tl.to(el.querySelector(".bob"), { y: -8, rotation: 3 * dir, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, start + 1.05);

        // petites étincelles à l'atterrissage
        const cx = parseFloat(el.style.left) + parseFloat(el.style.width) / 2;
        const cy = parseFloat(el.style.top) + parseFloat(el.style.height) / 2;
        for (let k = 0; k < 3; k++) {
          const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          s.setAttribute("class", "sp");
          s.setAttribute("viewBox", "0 0 40 40");
          s.innerHTML = '<use href="#star" fill="' + sparkColors[(i + k) % sparkColors.length] + '"/>';
          s.style.left = cx + "px";
          s.style.top = cy + "px";
          sign.appendChild(s);
          const a = -Math.PI / 2 + (k - 1) * 0.9 + (i % 2 ? 0.3 : -0.3);
          const r = 95 + k * 22;
          gsap.set(s, { autoAlpha: 0, scale: 0.2 });
          tl.fromTo(s, { autoAlpha: 1, x: 0, y: 0, scale: 0.3, rotation: 0 },
            { x: Math.cos(a) * r, y: Math.sin(a) * r, scale: 1 - k * 0.2, rotation: 120, duration: 0.45, ease: "power3.out", immediateRender: false }, start + 0.62);
          tl.to(s, { autoAlpha: 0, scale: 0.1, duration: 0.25, ease: "power1.in" }, start + 0.95);
        }
      });

      // scintillements dorés autour de l'étiquette
      const twinkles = [[250, 300, 2.1], [830, 300, 2.5], [180, 560, 2.9], [900, 480, 3.3], [540, 90, 3.7], [300, 690, 4.1], [780, 700, 4.5]];
      twinkles.forEach(([x, y, at], i) => {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("class", "sp");
        s.setAttribute("viewBox", "0 0 40 40");
        s.innerHTML = '<use href="#star" fill="' + (i % 2 ? "#FDF0E2" : "#F1C680") + '"/>';
        s.style.left = x + "px";
        s.style.top = y + "px";
        sign.appendChild(s);
        gsap.set(s, { autoAlpha: 0, scale: 0 });
        tl.to(s, { autoAlpha: 1, scale: 1.1, rotation: 90, duration: 0.3, ease: "back.out(2)" }, at);
        tl.to(s, { autoAlpha: 0, scale: 0, rotation: 180, duration: 0.35, ease: "power2.in" }, at + 0.35);
      });

      // ---------- 4. SORTIE (5.35 → 6.1) : l'étiquette remonte ----------
      tl.to(sign, { y: 30, duration: 0.18, ease: "power2.out" }, 5.35);
      tl.to(sign, { y: -1150, duration: 0.55, ease: "power3.in" }, 5.53);
      tl.set(sign, { autoAlpha: 0 }, 6.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
